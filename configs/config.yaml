
seed: 42

dataset:
  name: brats
  root_dir: datasets/raw/Task01_BrainTumour
  split_file: configs/splits/brats_seed42.json

model:
  name: unet3d
  in_channels: 4
  out_channels: 4
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]
  num_res_units: 2
  norm: INSTANCE
  dropout: 0.0

training:
  batch_size: 1
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  patch_size: [96, 96, 96]
  foreground_prob: 0.70
  num_workers: 0
  amp: true
  max_grad_norm: 12.0
  patience: 10
  min_delta: 0.001

validation:
  roi_size: [96, 96, 96]
  overlap: 0.25

experiment:
  output_dir: results/brats_unet3d_seed42
